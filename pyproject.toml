[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "olostep-docs-rag"
version = "0.1.0"
description = "Turn any docs site into a RAG chatbot with Olostep Crawls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "olostep>=1.2.3",
    "anthropic>=0.75",
    "sentence-transformers>=3.0",
    "chromadb>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
olostep-docs-rag = "olostep_docs_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olostep_docs_rag"]

[tool.ruff]
# Short lines read better in a video.
line-length = 79
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:olostep.*"]
